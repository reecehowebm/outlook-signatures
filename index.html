
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bridmet Signature</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="config.js"></script>
  <script src="taskpane.js" defer></script>
</head>
<body>
  <main class="panel">
    <h1>Bridmet signature</h1>
    <p class="intro">Select the shared mailbox you're sending from and insert your Bridmet signature.</p>

    <label for="department">Shared mailbox</label>
    <select id="department" disabled>
      <option value="HR" selected>Bridmet HR</option>
      <option value="Purchasing">Purchasing</option>
      <option value="Accounts">Accounts</option>
      <option value="Orders">Orders</option>
      <option value="Quality">Quality</option>
      <option value="Dorset Screen Print Enquiries">Dorset Screen Print Enquiries</option>
      <option value="Enquiries">Enquiries</option>
    </select>

    <label for="employeeName">Your name</label>
    <input id="employeeName" type="text" autocomplete="name" placeholder="e.g. Alex Smith" disabled>

    <p id="matchNote" class="note">Checking your Outlook account…</p>
    <button id="insertButton" type="button" disabled>Insert my signature</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="small">Check the message before sending. The name is a convenience field and is not identity verification.</p>
  </main>
</body>
</html>
